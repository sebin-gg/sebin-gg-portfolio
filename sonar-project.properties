sonar.projectKey=sebin-gg_portfolio
sonar.organization=sebin-gg

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.{ts,tsx}

# src/app = thin App Router adapters (framework contract code).
# Operator utilities in scripts/ stay out of analysis entirely: their
# fetch/URL args come from operator argv, not server requests (no SSRF
# surface, and Sonar's taint model can't see that boundary).
sonar.exclusions=src/app/**/*.ts,src/test/**,scripts/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

sonar.coverage.exclusions=src/app/**,src/test/**,src/components/icons.tsx

sonar.qualitygate.wait=true
sonar.verbose=false
