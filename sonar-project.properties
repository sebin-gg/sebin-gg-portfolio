sonar.projectKey=sebin-gg_portfolio
sonar.organization=sebin-gg

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.{ts,tsx}

sonar.exclusions=src/app/**/*.ts,src/test/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

sonar.coverage.exclusions=src/app/**,src/test/**,src/components/icons.tsx

sonar.qualitygate.wait=true
sonar.verbose=false
