sonar.projectKey=sebin-gg_portfolio
sonar.organization=sebin-gg

sonar.sources=src,scripts
sonar.tests=src
sonar.test.inclusions=**/*.test.{ts,tsx}

# src/app = thin App Router adapters; scripts = operator utilities whose
# fetch/URL args are environment-driven, not request-driven (no SSRF surface).
sonar.exclusions=src/app/**/*.ts,src/test/**,scripts/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

sonar.coverage.exclusions=src/app/**,src/test/**,src/components/icons.tsx

sonar.qualitygate.wait=true
sonar.verbose=false
