version = 1

# Route files under src/app are thin App Router adapters and src/components
# exports are the React component contract; the analyzer's global-scope
# function check (JS-0067) false-positives on both. Application logic in
# src/lib remains fully analyzed. ESLint (complexity cap ≤ 4) covers real
# complexity everywhere else.
exclude_patterns = ["src/app/**", "src/components/**"]

# Test code is marked, not excluded, so the analyzer still reports real
# problems in it while dropping rules that test frameworks require breaking —
# notably the async-function rule, which every Playwright callback trips.
test_patterns = ["e2e/**", "**/*.test.ts", "**/*.test.tsx"]

[[analyzers]]
name = "javascript"
enabled = true