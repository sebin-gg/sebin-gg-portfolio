version = 1

# Route files under src/app are thin App Router adapters and src/components
# exports are the React component contract; the analyzer's global-scope
# function check (JS-0067) false-positives on both — every `export function`
# in an ES module is module-scoped and cannot pollute a global scope.
# Application logic in src/lib remains fully analyzed, so a genuine global
# declaration there is still reported. ESLint (complexity cap ≤ 4) covers real
# complexity everywhere else.
#
# The patterns need the leading `**/` to match. Written as bare `src/app/**`
# they silently matched nothing, so both trees were analyzed anyway and JS-0067
# was reported on pre-existing functions (generateMetadata, Terminal,
# terminalTable, normalizeCommand, unknownResult, runTerminalCommand) as soon
# as a pull request touched those files. DeepSource's own documentation writes
# these globs in the `**/path/**` form.
#
# Test sources get the same treatment: a top-level `function` or `const` in a
# Vitest spec is module-scoped, so JS-0067 ("unexpected function declaration in
# the global scope") false-positives there exactly as it does in the component
# and App Router trees above.
#
# `*.mjs` is excluded because this analyzer parses it with `sourceType: script`
# and then rejects every `import`/`export` (JS-0833: "'import' and 'export' may
# appear only with 'sourceType: module'"). A file it cannot parse yields no
# findings anyway, so excluding it removes the false alarm without losing
# coverage. The Node scripts under scripts/ stay covered by ESLint, `node
# --check`, tsc, CodeQL, and SonarCloud.
exclude_patterns = [
  "**/src/app/**",
  "**/src/components/**",
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/*.mjs",
]

[[analyzers]]
name = "javascript"
enabled = true