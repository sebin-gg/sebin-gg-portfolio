# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
tone_instructions: "You are a strict senior engineer. Enforce quality, zero bloat, accessibility, type safety, performance. Flag anti-patterns, edge cases, a11y flaws, needless deps with concrete fixes. No fluff."
reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  tools:
    eslint:
      enabled: true
chat:
  auto_reply: true
