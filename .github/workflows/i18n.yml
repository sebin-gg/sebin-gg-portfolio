name: i18n

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: i18n-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translate:
    name: Refresh translations (General Translation)
    runs-on: ubuntu-latest
    # Step-level `if` cannot read the secrets context, so expose only a
    # boolean flag here. The actual credentials are scoped to the single
    # step that needs them (CWE-200: keep secrets off pnpm install and
    # other actions). Skips quietly while GT secrets are unconfigured;
    # locales keep their committed translations.
    env:
      HAS_GT_CREDS: ${{ secrets.GT_API_KEY != '' && secrets.GT_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Skips quietly while the GT account/secrets are not configured yet;
      # locales keep their committed translations. A quota rejection is
      # expected on the free plan — the run stays green so the workflow can
      # succeed later in the month when usage resets or the plan upgrades.
      - name: gt translate
        if: ${{ env.HAS_GT_CREDS == 'true' }}
        env:
          GT_API_KEY: ${{ secrets.GT_API_KEY }}
          GT_PROJECT_ID: ${{ secrets.GT_PROJECT_ID }}
        # Declared devDependency, run via the local binary (Sonar S6505:
        # no on-demand `npx` installs). Pin reviewed on bumps.
        run: pnpm exec gt translate || echo "::warning::gt translate failed (quota or API error) — committed translations kept"

      - name: Detect changed translations
        id: diff
        run: echo "count=$(git status --porcelain -- src/lib/i18n | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Create translation update PR
        if: steps.diff.outputs.count != '0'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "i18n: refresh translations from General Translation"
          title: "i18n: translation updates"
          body: |
            Automated refresh of `src/lib/i18n/*.json` by the General Translation
            CLI (`gt translate`). Review diffs, especially for locales whose
            translation quality matters to you, then merge.
          branch: i18n/auto-translations
          delete-branch: true
          labels: i18n
