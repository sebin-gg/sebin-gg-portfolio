name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, format & unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Unit tests with coverage
        run: pnpm test:unit

      - name: CRAP complexity gate
        run: pnpm crap:gate

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Production build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # One build, every downstream job reuses it — no `pnpm build` in the
      # e2e/cross-browser jobs. Prune the build cache first: `next start`
      # never reads it, and it only bloats the artifact.
      - name: Prune build cache
        run: rm -rf .next/cache

      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: next-build
          path: .next
          # .next is a dot-directory; without this the step uploads nothing.
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Browser suites only exercise the built site: skip expensive steps when
      # nothing E2E-relevant changed. The job still ends green on purpose — the
      # checks are required, and a skipped job would leave them pending.
      - name: Detect E2E-relevant changes
        id: e2e_changes
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          # Shallow checkout: fetch the base commit. No usable base (first push,
          # force-push, failed fetch) -> run rather than risk a false skip.
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BASE" || BASE=""
          else
            BASE=""
          fi
          if [ -z "$BASE" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          RELEVANT='^(src/|public/|e2e/|package\.json$|pnpm-lock\.yaml$|playwright\.config\.ts$|next\.config\.|tsconfig\.json$|\.github/workflows/ci\.yml$)'
          echo "run=$(git diff --name-only "$BASE" HEAD | grep -Eq "$RELEVANT" && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.e2e_changes.outputs.run == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.e2e_changes.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.e2e_changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # Cache keyed on the Playwright version so browsers re-download only
      # when it changes.
      - name: Cache Playwright browsers
        if: steps.e2e_changes.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.e2e_changes.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Download production build
        if: steps.e2e_changes.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build
          path: .next

      - name: Run e2e tests
        run: pnpm test:e2e --project=${{ matrix.browser }}
        if: steps.e2e_changes.outputs.run == 'true'
        env:
          E2E_SKIP_BUILD: 1

      - name: Upload Playwright report
        if: always() && steps.e2e_changes.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

      - name: Explain E2E skip
        if: steps.e2e_changes.outputs.run != 'true'
        run: echo "No E2E-relevant files changed, so the browser suites were skipped."

  mobile:
    name: E2E (mobile emulation)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Browser suites only exercise the built site: skip expensive steps when
      # nothing E2E-relevant changed. The job still ends green on purpose — the
      # checks are required, and a skipped job would leave them pending.
      - name: Detect E2E-relevant changes
        id: e2e_changes
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          # Shallow checkout: fetch the base commit. No usable base (first push,
          # force-push, failed fetch) -> run rather than risk a false skip.
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BASE" || BASE=""
          else
            BASE=""
          fi
          if [ -z "$BASE" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          RELEVANT='^(src/|public/|e2e/|package\.json$|pnpm-lock\.yaml$|playwright\.config\.ts$|next\.config\.|tsconfig\.json$|\.github/workflows/ci\.yml$)'
          echo "run=$(git diff --name-only "$BASE" HEAD | grep -Eq "$RELEVANT" && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.e2e_changes.outputs.run == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.e2e_changes.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.e2e_changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        if: steps.e2e_changes.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.e2e_changes.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Download production build
        if: steps.e2e_changes.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build
          path: .next

      - name: Run mobile e2e tests
        run: pnpm exec playwright test --project=mobile
        if: steps.e2e_changes.outputs.run == 'true'
        env:
          E2E_SKIP_BUILD: 1

      - name: Upload Playwright report
        if: always() && steps.e2e_changes.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-mobile
          path: playwright-report/
          retention-days: 14

      - name: Explain E2E skip
        if: steps.e2e_changes.outputs.run != 'true'
        run: echo "No E2E-relevant files changed, so the browser suites were skipped."

  terminal-browsers:
    name: Terminal browsers (lynx/w3m/links)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install terminal browsers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lynx w3m links

      - name: Download production build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build
          path: .next

      - name: Run terminal browser check
        run: pnpm check:terminal

  # ---------------------------------------------------------------------------
  # Cross-platform parity: Windows x64 and Windows ARM64.
  #
  # These are ADDITIVE on purpose. `main` is branch-protected with required
  # status checks pinned to the literal job names "Lint, typecheck, format &
  # unit tests" and "Production build". Converting those two jobs into a matrix
  # would rename their check contexts to "Quality (windows-latest)" etc., the
  # pinned contexts would never report, and the PR could never be merged.
  # So the Ubuntu jobs above stay exactly as they were, and the extra
  # platforms live in their own jobs here.
  #
  # windows-11-arm is real ARM64 hardware (Snapdragon), so it also catches
  # 64-bit alignment/pointer assumptions a cross-build would miss.
  # All standard runners -> free while the repo is public.
  # ---------------------------------------------------------------------------
  quality-crossplatform:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Record platform result
        if: always()
        shell: bash
        run: |
          {
            echo "### \`${{ matrix.os }}\` — ${{ job.status }}"
            echo "| key | value |"
            echo "| --- | --- |"
            echo "| arch | \`$(node -p 'process.arch')\` |"
            echo "| platform | \`$(node -p 'process.platform')\` |"
            echo "| node | \`$(node --version)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-crossplatform:
    name: Production build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: quality-crossplatform
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # `rm -rf` is not a cmd.exe builtin, hence the explicit bash shell.
      - name: Prune build cache
        shell: bash
        run: rm -rf .next/cache
