name: Hygiene

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spell:
    name: Spell check (cspell)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: streetsidesoftware/cspell-action@6f3c77c1406bc930f944ba97e9801a22e42caf58 # v9.1.0
        with:
          config: ./cspell.json
          strict: true

  links:
    name: Dead-link check (lychee)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # LinkedIn and X block bot traffic, so they are excluded to avoid
      # false failures; every other link is checked with retries.
      # (mailto: links are excluded by default in lychee v2.)
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --verbose --max-retries 2 --exclude 'linkedin.com' --exclude 'x.com' '**/*.md' 'public/llms.txt'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./scripts
          severity: warning

  actions-sec:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
