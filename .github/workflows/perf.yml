name: Performance budgets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse (full matrix + budgets)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Lighthouse
        run: pnpm exec playwright install chromium

      - name: Build
        run: pnpm build

      - name: Run Lighthouse audits (budgets + full matrix)
        run: |
          pnpm start --port 3100 > /tmp/app.log 2>&1 &
          APP_PID=$!
          # Poll until the server answers (no extra dependency needed).
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3100 > /dev/null; then break; fi
            sleep 1
          done
          CHROME_PATH="$(find ~/.cache/ms-playwright -type f -name chrome -path '*chromium-*' | head -1)"
          echo "Using Chromium at: $CHROME_PATH"
          export CHROME_PATH
          EXIT_CODE=0

          # 1. Budget + category floors on the standard slow-4G mobile profile.
          pnpm exec lhci autorun || EXIT_CODE=$?

          # 2. Full matrix: themes × networks (2G/3G/4G) × CPU (laptop/phone/
          #    mid-tier/low-tier/20x) × devices (mobile/desktop) × modes
          #    (navigation/timespan/snapshot) × routes (/, /blog).
          #    a11y/bp/seo must be 100 everywhere; perf 100 except the
          #    best-effort 2G/20x rows. Reuses the server started above.
          pnpm perf:matrix --server 3100 || EXIT_CODE=$?

          kill "$APP_PID" 2> /dev/null || true
          exit $EXIT_CODE

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results
          path: lighthouse-results/
          retention-days: 14
