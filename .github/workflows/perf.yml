name: Performance budgets

on:
  push:
    branches: [main]
  pull_request:
  # Full 288-run matrix runs nightly only; PRs/pushes run budgets + the
  # 8-run quick subset (perf:quick) for speed with no coverage loss on
  # enforced floors.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse (budgets + ${{ github.event_name == 'schedule' && 'full matrix' || 'quick subset' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Lighthouse
        run: pnpm exec playwright install chromium

      - name: Build
        run: pnpm build

      - name: Run Lighthouse audits (budgets + full matrix)
        run: |
          pnpm start --port 3100 > /tmp/app.log 2>&1 &
          APP_PID=$!
          # Poll until the server answers (no extra dependency needed).
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3100 > /dev/null; then break; fi
            sleep 1
          done
          CHROME_PATH="$(find ~/.cache/ms-playwright -type f -name chrome -path '*chromium-*' | head -1)"
          echo "Using Chromium at: $CHROME_PATH"
          export CHROME_PATH
          EXIT_CODE=0

          # 1. Budget + category floors on the standard slow-4G mobile profile.
          pnpm exec lhci autorun || EXIT_CODE=$?

          # 2. Nightly: full matrix (themes × networks × CPU × devices ×
          #    modes × routes). PRs/pushes: 8-run quick subset covering both
          #    routes × both devices at 4G (laptop + 4x CPU). Same floors in
          #    both: a11y/bp/seo 100 everywhere, perf 100 where reachable.
          #    Reuses the server started above.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            pnpm perf:matrix --server 3100 || EXIT_CODE=$?
          else
            pnpm perf:quick --server 3100 || EXIT_CODE=$?
          fi

          kill "$APP_PID" 2> /dev/null || true
          exit $EXIT_CODE

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results
          path: lighthouse-results/
          retention-days: 14
