name: Clear stale reviews

# CodeRabbit is incremental and rate-limited: it stops emitting fresh review
# states once the hourly allowance is spent, which leaves `reviewDecision`
# pinned to CHANGES_REQUESTED on a commit that is several pushes behind HEAD.
# That blocks merges even though every finding is fixed and resolved.
#
# This job re-asserts the merge gate from evidence instead of a stale bot
# state. It dismisses a CHANGES_REQUESTED review ONLY when all of these hold:
#
#   1. the review targets a commit that is no longer the PR head (it is stale),
#   2. every review thread authored by that bot on this PR is resolved,
#   3. every required status check is green on the current head SHA,
#   4. the review is not the most recent push (see the guard below).
#
# Any failing condition leaves the review untouched and the job reports what
# it is waiting on. This never approves anything and never bypasses
# branch protection.

# zizmor: ignore[dangerous-triggers] -- `pull_request_target` is required here
# and is safe: this job never checks out or executes PR head code. It only reads
# the PR number from the event payload and calls the API with the default token.
# Plain `pull_request` would run with a read-only token for fork PRs and so could
# not read check runs or dismiss a review.
on:
  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to re-evaluate"
        required: true

permissions:
  checks: read # Read check-run status on the head commit (gate 3).

concurrency:
  group: clear-stale-reviews-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  clear:
    name: Clear stale bot reviews
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Dismiss a stale review. The job's only write.
      checks: read # Read check-run status on the head commit (gate 3).
    steps:
      - name: Evaluate and dismiss stale reviews
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          # Dependabot PRs are never auto-cleared; a human reads those.
          ACTOR: ${{ github.actor }}
          # Author of the reviews this job is allowed to dismiss.
          REVIEWER: coderabbitai[bot]
        run: |
          set -euo pipefail

          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "::notice::Dependabot PR — leaving reviews untouched."
            exit 0
          fi

          head_sha=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
          echo "PR #$PR head: $head_sha"

          # --- Gate 3: every required check must be green on this exact SHA ---
          gh api "repos/$REPO/commits/$head_sha/check-runs?per_page=100" \
            --paginate --jq '.check_runs[] | "\(.name)\t\(.status)\t\(.conclusion)"' \
            > /tmp/checks.tsv || true
          pending=$(awk -F'\t' '$2 != "completed"' /tmp/checks.tsv | wc -l | tr -d ' ')
          failing=$(awk -F'\t' '$2 == "completed" && $3 != "success" && $3 != "skipped" && $3 != "neutral"' /tmp/checks.tsv | wc -l | tr -d ' ')
          if [ "$pending" -ne 0 ]; then
            echo "::notice::$pending check(s) still running — not touching reviews."
            exit 0
          fi
          if [ "$failing" -ne 0 ]; then
            echo "::notice::$failing check(s) not green — not touching reviews."
            awk -F'\t' '$2 == "completed" && $3 != "success" && $3 != "skipped" && $3 != "neutral"' /tmp/checks.tsv
            exit 0
          fi

          # --- Gate 2: no unresolved threads from this reviewer ---
          # The author filter runs client-side in jq, not as a GraphQL variable:
          # `gh --jq` cannot see query variables, and declaring one unused makes
          # the API reject the whole query.
          unresolved=$(gh api graphql -f query='
            query($owner:String!, $repo:String!, $pr:Int!) {
              repository(owner:$owner, name:$repo) {
                pullRequest(number:$pr) {
                  reviewThreads(first:100) {
                    nodes {
                      isResolved
                      comments(last:1) { nodes { author { login } } }
                    }
                  }
                }
              }
            }' \
            -F owner="${REPO%%/*}" -F repo="${REPO##*/}" -F pr="$PR" \
            --jq "[.data.repository.pullRequest.reviewThreads.nodes[]
                   | select(.comments.nodes[0].author.login == \"$REVIEWER\")
                   | select(.isResolved == false)] | length")
          if [ "${unresolved:-0}" -ne 0 ]; then
            echo "::notice::$unresolved unresolved $REVIEWER thread(s) — not touching reviews."
            exit 0
          fi

          # --- Gates 1 and 4: dismiss only stale CHANGES_REQUESTED reviews ---
          reviews=$(gh api "repos/$REPO/pulls/$PR/reviews?per_page=100" --paginate \
            --jq "[.[] | select(.user.login == \"$REVIEWER\")
                   | select(.state == \"CHANGES_REQUESTED\")
                   | {id: .id, commit_id: .commit_id}]")
          count=$(echo "$reviews" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "No stale $REVIEWER CHANGES_REQUESTED reviews to clear."
            exit 0
          fi

          echo "$reviews" | jq -r '.[] | "  \(.id)  \(.commit_id)"'
          echo "$reviews" | jq -r '.[].id' | while read -r id; do
            commit=$(echo "$reviews" | jq -r --argjson i "$id" '.[] | select(.id == $i) | .commit_id')
            if [ "$commit" = "$head_sha" ]; then
              echo "::notice::Review $id targets the current head — it is live, leaving it."
              continue
            fi
            if ! git merge-base --is-ancestor "$commit" "$head_sha" 2>/dev/null; then
              # Not an ancestor of HEAD (force-push/rewrite): treat as stale but say so.
              echo "Review $id commit $commit is not an ancestor of HEAD; dismissing as stale."
            fi
            gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$id/dismissals" \
              -f event=DISMISS \
              -f message="Stale: raised against $commit, which is behind PR #$PR head $head_sha. All $REVIEWER threads are resolved and every required check is green on the current head." \
              --jq '"dismissed \(.id) -> \(.state)"'
          done

          echo "Final reviewDecision: $(gh pr view "$PR" --repo "$REPO" --json reviewDecision --jq .reviewDecision)"
