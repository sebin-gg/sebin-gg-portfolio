name: SonarCloud

# Registered under a fresh filename (sonar-pr.yml): GitHub caches workflow
# definitions by file path, and the retired sonar.yml still spawned zero-job
# "push" runs (shown red) from its stale cached copy. A new path means pushes
# to main can never match this workflow; it runs on PRs only.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    # Dependabot runs have no secrets; run only when the SONAR_TOKEN secret
    # has been configured (see scripts/links.sh).
    if: ${{ github.actor != 'dependabot[bot]' && env.SONAR_TOKEN != '' }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones hurt Sonar's blame/coverage linking.

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests with coverage (for Sonar)
        run: pnpm test:unit

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
