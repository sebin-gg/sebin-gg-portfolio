name: Browser sweep

# Nightly Chrome-family sweep via puppeteer-core discovery. Covers locally
# installed engines that the hosted e2e matrix cannot (Thorium, Brave, Edge,
# Vivaldi, Opera…). PRs never pay for this.
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

concurrency:
  group: browser-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: Chrome-family sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chrome is preinstalled on ubuntu-latest runners; the discovery script
      # picks up whatever Chrome-family browsers exist.
      - name: Build
        run: pnpm build

      - name: Run browser sweep
        run: pnpm check:browsers

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-sweep-screenshots
          path: docs/screenshots/
          retention-days: 7
