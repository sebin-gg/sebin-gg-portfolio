name: Browser sweep

# Nightly Chrome-family sweep via puppeteer-core discovery. Covers locally
# installed engines that the hosted e2e matrix cannot (Thorium, Brave, Edge,
# Vivaldi, Opera…). PRs never pay for this.
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

concurrency:
  group: browser-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: Chrome-family sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chrome is preinstalled on ubuntu-latest runners; the discovery script
      # picks up whatever Chrome-family browsers exist.
      - name: Build
        run: pnpm build

      - name: Run browser sweep
        run: pnpm check:browsers

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c3c89aef350131 # v7
        with:
          name: browser-sweep-screenshots
          path: docs/screenshots/
          retention-days: 7
