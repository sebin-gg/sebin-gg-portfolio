name: Browser sweep

# Nightly Chrome-family sweep via puppeteer-core discovery. Covers locally
# installed engines that the hosted e2e matrix cannot (Thorium, Brave, Edge,
# Vivaldi, Opera…). PRs never pay for this.
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

concurrency:
  group: browser-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: Chrome-family sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chrome is preinstalled on ubuntu-latest runners; the discovery script
      # picks up whatever Chrome-family browsers exist.
      - name: Build
        run: pnpm build

      - name: Run browser sweep
        run: pnpm check:browsers

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-sweep-screenshots
          path: docs/screenshots/
          retention-days: 7
